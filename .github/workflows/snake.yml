name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # check out the repo first (some users report this fixes the canvas error)
      - name: Checkout repo
        uses: actions/checkout@v4

      # generate the snake — using the main action, NOT /svg-only
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=#14B8A6&color_dots=#1a1a1a,#0d4d47,#14b8a6,#5eead4,#f87171
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # push generated files to the `output` branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
